<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1217" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Медкарта">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Медкарта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=85">
</head>
<body>
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <span class="logo" aria-hidden="true"></span>
      <h1>Медкарта</h1>
      <p>Анализы, динамика и нормы в одном месте. Данные видишь только ты.</p>
      <button type="button" class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Войти через Google
      </button>
      <p class="gate-msg" id="gateMsg"></p>
    </div>
  </div>

  <div class="page">
    <header class="top">
      <a class="brand" href="#"><span class="logo" aria-hidden="true"></span>Медкарта</a>
      <nav class="tabs" aria-label="Разделы">
        <div class="tab-grp"><button class="tab" data-view="calendar" title="Календарь"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Календарь</span></button><button class="tab" data-view="food" title="Еда"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg><span>Еда</span></button></div>
        <div class="tab-grp"><button class="tab" data-view="labs" title="Анализы" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/></svg><span>Анализы</span></button><button class="tab" data-view="studies" title="Обследования"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2"/></svg><span>Обследования</span></button><button class="tab" data-view="symptoms" title="Симптомы"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>Симптомы</span></button></div>
        <div class="tab-grp"><button class="tab" data-view="therapy" title="Лечение"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg><span>Лечение</span></button><button class="tab" data-view="drugs" title="Препараты"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="13" rx="2.5"/><path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V8M12 11.5v6M9 14.5h6"/></svg><span>Препараты</span></button></div>
      </nav>
      <div class="top-actions">
        <button class="btn ghost menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Данные</span></button>
        <div class="menu" id="menu" hidden>
          <div class="acct" id="acct"></div>
          <button id="reportBtn">Сводка для врача</button>
          <button id="eventsBtn">События и лечение</button>
          <button id="profileBtn">Профиль: пол и возраст</button>
          <button id="exportBtn">Сохранить копию в файл</button>
          <label class="menu-file">Загрузить из файла<input type="file" id="importInput" accept="application/json,.json"></label>
        </div>
        <button class="btn primary" id="addBtn">+ Внести анализы</button>
      </div>
    </header>

    <div class="seg mob-seg" id="mobSeg" role="tablist" aria-label="Результаты"><button type="button" data-view-go="labs">Анализы</button><button type="button" data-view-go="studies">Обследования</button></div>
    <div class="seg mob-seg mob-seg2" id="mobSeg2" role="tablist" aria-label="Лечение"><button type="button" data-view-go="therapy">Лечение</button><button type="button" data-view-go="drugs">Препараты</button></div>
    <div id="calendarView" class="studies symptoms calendar" hidden></div>
    <div id="foodView" class="studies symptoms calendar food" hidden></div>
    <div id="labsView">
    <section class="overview" id="overview" aria-label="Сводка"></section>
    <section class="due" id="due" hidden aria-label="Пора пересдать"></section>

    <section class="block">
      <div class="block-head">
        <h2>Показатели <span class="count num" id="count"></span></h2>
      </div>
      <div class="toolbar">
        <div class="searchbox">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Найти показатель — по-русски, українською или in English" aria-label="Поиск показателя">
          <button type="button" class="search-clear" id="qClear" aria-label="Очистить поиск" hidden>×</button>
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </div>
        <div class="toolbar-row">
          <div class="groups" id="groups" role="group" aria-label="Группы"></div>
          <div class="seg" id="statusSeg" role="group" aria-label="Фильтр по состоянию">
            <button data-s="all" aria-pressed="true">Все</button>
            <button data-s="bad" aria-pressed="false">Вне нормы</button>
            <button data-s="multi" aria-pressed="false">С динамикой</button>
          </div>
          <div class="sitpick" id="sitPick">
            <button type="button" class="sit-btn" id="sitBtn" aria-haspopup="dialog" aria-expanded="false"></button>
            <div class="sit-pop" id="sitPop" role="dialog" aria-label="Выбор ситуации" hidden></div>
          </div>
          <button type="button" class="reset-btn" id="resetBtn" hidden><svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Сбросить</button>
        </div>
        <div class="sitbar" id="sitBar" hidden></div>
      </div>
      <div class="list-wrap">
        <nav class="rail" id="rail" aria-label="Разделы"></nav>
        <div id="list" class="list"></div>
      </div>
    </section>

    <section class="block" id="historyBlock">
      <div class="block-head"><h2>История сдач</h2>
        <div class="hist-ctl" id="histCtl">
          <div class="seg"><button data-h="list" aria-pressed="true">Сдачи</button><button data-h="map" aria-pressed="false">Карта</button></div>
          <button type="button" class="btn sm" data-cmp-open>Сравнить даты</button>
          <button type="button" class="btn sm" data-ev-new>+ Событие</button>
        </div></div>
      <div id="timeline" class="timeline"></div>
    </section>

    </div>
    <div id="studiesView" class="studies" hidden></div>
    <div id="symptomsView" class="studies symptoms" hidden></div>
    <div id="therapyView" class="studies symptoms therapy" hidden></div>
    <div id="drugsView" class="studies symptoms drugs" hidden></div>

    <footer class="foot" id="localNote">Данные хранятся только в этом браузере. Делай копию через «Данные → Сохранить копию в файл».</footer>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Навигация">
    <button type="button" class="tb" data-tb="calendar"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Календарь</span></button>
    <button type="button" class="tb" data-tb="list" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Анализы</span></button>
    
    <button type="button" class="tb tb-add" data-tb="add" aria-label="Внести анализы"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button type="button" class="tb" data-tb="symptoms"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-7-10.2A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7 2.8C19 16.6 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>Симптомы</span></button>
    <button type="button" class="tb" data-tb="therapy"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-45 12 12)" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.5 9.5l5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Лечение</span></button>
    <button type="button" class="tb" data-tb="food"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7v3h3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Еда</span></button>
  </nav>

  <dialog id="entry" class="dialog entry-dlg" aria-labelledby="entryTitle">
    <form method="dialog" id="entryForm" novalidate>
      <div class="dlg-head">
        <h3 id="entryTitle">Новая сдача</h3>
        <button type="button" class="icon-btn" id="entryClose" aria-label="Закрыть">×</button>
      </div>

      <div class="when">
        <div class="date-row">
          <button type="button" class="date-pick" id="datePick" aria-label="Изменить дату сдачи">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span id="dpText">24 сентября 2026</span>
          </button>
          <input type="hidden" id="eDate">
          <div class="calpop" id="calPop" hidden></div>
          <div class="date-quick" id="dateQuick" role="group" aria-label="Быстрый выбор даты">
            <button type="button" data-d="0" aria-pressed="true">Сегодня</button>
            <button type="button" data-d="1" aria-pressed="false">Вчера</button>
          </div>
        </div>
        <div class="lab-row">
          <span class="lab-k">Лаборатория</span>
          <button type="button" class="lab-show" id="labShow"><span id="labText">не указана</span><span class="lab-edit-hint">изменить</span></button>
          <span id="labEdit" hidden><input class="input lab-input" id="eLab" list="labList" placeholder="Например: Синево" autocomplete="off"><datalist id="labList"></datalist></span>
        </div>
      </div>

      <div class="adder">
        <div class="addwrap">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="addQ" autocomplete="off" spellcheck="false" placeholder="Добавить анализ: ТТГ, холестерин, TSH…" role="combobox" aria-expanded="false" aria-controls="addSugg" aria-label="Добавить анализ">
          <ul class="add-sugg" id="addSugg" role="listbox" hidden></ul>
        </div>
        <div class="quick" id="quick"></div>
      </div>

      <div class="cards" id="rows"></div>

      <p class="hint" id="entryMsg" hidden></p>
      <div class="dlg-foot">
        <span class="foot-tip">Enter — к следующему анализу</span>
        <button type="button" class="btn ghost" id="entryCancel">Отмена</button>
        <button type="submit" class="btn primary" id="entrySave" disabled>Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="xDlg" class="dialog x-dlg"><div id="xBody"></div></dialog>
  <div id="printRoot"></div>
  <dialog id="lightbox" class="lightbox"></dialog>

  <dialog id="infoDlg" class="dialog info-dlg" aria-label="Об анализе">
    <div class="info-wrap" id="infoBody"></div>
  </dialog>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=85"></script>
  <script src="catalog.js?v=85"></script>
  <script src="info.js?v=85"></script>
  <script src="info-hl.js?v=85"></script>
  <script src="treat.js?v=85"></script>
  <script src="guides.js?v=85"></script>
  <script src="panels.js?v=85"></script>
  <script src="seed.js?v=85"></script>
  <script src="cloud.js?v=85"></script>
  <script src="ui.js?v=85"></script>
  <script src="signif.js?v=85"></script>
  <script src="extras.js?v=85"></script>
  <script src="studies.js?v=85"></script>
  <script src="symptoms.js?v=85"></script>
  <script src="diary.js?v=85"></script>
  <script src="calendar.js?v=85"></script>
  <script src="foods.js?v=85"></script>
  <script src="foods-nut.js?v=85"></script>
  <script src="food.js?v=85"></script>
  <script src="foodnut.js?v=85"></script>
  <script src="headache.js?v=85"></script>
  <script src="drugs.js?v=85"></script>
  <script src="therapy.js?v=85"></script>
  <script src="drugview.js?v=85"></script>
  <script src="app.js?v=85"></script>
</body>
</html>
